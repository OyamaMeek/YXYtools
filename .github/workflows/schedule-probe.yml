name: Schedule trigger probe

"on":
  schedule:
    - cron: '48,53 9 4 10 *'

permissions: {}

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 1
    steps:
      - name: Record scheduled event
        env:
          EVENT_NAME: ${{ github.event_name }}
          SCHEDULE: ${{ github.event.schedule }}
        run: |
          printf 'event=%s schedule=%s\n' "$EVENT_NAME" "$SCHEDULE"
          date --utc --iso-8601=seconds
